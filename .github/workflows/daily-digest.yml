name: daily-digest

on:
  schedule:
    - cron: "30 13 * * *"   # 13:30 UTC = 19:00 IST, every evening
  workflow_dispatch: {}      # "Run workflow" button for manual runs

permissions:
  contents: write            # to commit the new digest back to the repo

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Tests
        run: python -m pytest -q

      - name: Build digest
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m digest -v

      # data/digest.db holds the response cache, per-call metrics and already-published URLs,
      # so it's committed too: that's how tomorrow's run knows what today's run published.
      - name: Commit digest
        run: |
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add out data
          git diff --cached --quiet || git commit -m "digest: $(date -u +%F)"
          git push
