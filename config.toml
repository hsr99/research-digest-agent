# What the digest is about. The ranker uses this as its definition of "relevant".
[topic]
description = """
AI and machine learning for practitioners: new models and architectures, LLM inference
and serving, agents and tool use, evals, training techniques, open-source releases,
and important industry moves. Skip hype, funding-only news, and generic opinion pieces.
"""
lookback_hours = 48     # overlap on purpose: the "seen" store stops repeats, and a 24h window
                        # drops stories published just before the previous run
max_items = 8           # stories in the final digest
max_candidates = 60     # stories sent to the LLM ranker after dedupe

[sources.arxiv]
categories = ["cs.AI", "cs.CL", "cs.LG"]
max_results = 60

[sources.hackernews]
min_points = 40
keywords = ["LLM", "GPT", "Claude", "Gemini", "Llama", "AI", "model", "agent",
            "inference", "transformer", "fine-tun", "RAG", "embedding", "vLLM", "diffusion"]

[sources.github]
# owner/repo whose new releases count as news
# (llama.cpp is left out on purpose: it tags a release on every commit)
repos = ["vllm-project/vllm", "huggingface/transformers", "ollama/ollama",
         "langchain-ai/langgraph", "unslothai/unsloth",
         "modelcontextprotocol/modelcontextprotocol", "pytorch/pytorch"]

[sources.rss]
feeds = [
  "https://huggingface.co/blog/feed.xml",
  "https://simonwillison.net/atom/everything/",
  "https://openai.com/news/rss.xml",
  "https://deepmind.google/blog/rss.xml",
  "https://www.interconnects.ai/feed",
  "https://magazine.sebastianraschka.com/feed",
]

# LLM providers, tried in order for each role. All speak the OpenAI chat API.
# A provider whose key is empty in .env is skipped automatically.
#
# COST GUARD: the router refuses to start unless every provider used below is marked
# free = true, and (for OpenRouter) every model ends with the required ":free" suffix.
# OpenRouter only bills non-":free" models, and NVIDIA NIM's free tier has no card attached,
# so this setup cannot incur charges.
[llm.providers.openrouter]
base_url = "https://openrouter.ai/api/v1"
key_env = "OPENROUTER_API_KEY"
free = true
require_model_suffix = ":free"
retries = 0             # free models are often busy upstream: move to the next one instead

[llm.providers.nvidia]
# NVIDIA NIM free tier (build.nvidia.com): no credit card, ~40 requests/min,
# meant for development and testing
base_url = "https://integrate.api.nvidia.com/v1"
key_env = "NVIDIA_API_KEY"
free = true

[llm.providers.ollama]
base_url = "http://localhost:11434/v1"
key_env = ""            # runs on your own machine; skipped if Ollama isn't running
free = true

# "rank" = cheap, fast scoring of many items. "write" = best model for summaries.
# If every rank model fails, the pipeline falls back to keyword ranking (no LLM).
[llm.roles]
rank = [
  { provider = "openrouter", model = "baidu/ernie-5.5-flash-preview:free" },
  { provider = "openrouter", model = "nvidia/nemotron-3.5-super-vl:free" },
  { provider = "openrouter", model = "google/gemma-4-26b-a4b-it:free" },
  { provider = "nvidia", model = "google/gemma-3-12b-it" },
  { provider = "nvidia", model = "nvidia/nemotron-3.5-lightning-30b-a3b" },
]
write = [
  { provider = "openrouter", model = "nvidia/nemotron-3-ultra-550b-a55b:free" },
  { provider = "openrouter", model = "google/gemma-4-31b-it:free" },
  { provider = "openrouter", model = "nvidia/nemotron-3.5-super-vl:free" },
  { provider = "nvidia", model = "mistralai/mistral-large-4-1t-a52b" },
  { provider = "nvidia", model = "nvidia/nemotron-3.5-super-vl-120b-a12b" },
  { provider = "ollama", model = "qwen2.5:3b" },
]
